name: Dashboard example checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['integrations/examples/**', '.github/workflows/dashboard-check.yml']
  push:
    paths: ['integrations/examples/**', '.github/workflows/dashboard-check.yml']
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: integrations/examples/economic-calendar-dashboard
